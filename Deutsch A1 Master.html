try{const db=await claude.use("db"),u=await claude.use("user");if(db&&u){ref=db.collection("data/users/"+await u.id()).doc("progress");const d=await ref.get();if(d.exists){const r=JSON.parse(d.data().s);if(Object.keys(r.p||{}).length>=Object.keys(S.p).length)S=Object.assign(S,r)}render()}}catch(e){}}
// ---- SRS ----
const st=w=>{const p=S.p[w.id];if(!p)return"new";if(p.b>=5)return"mastered";if(p.w>p.c&&p.b<=1)return"difficult";if(p.b<=2)return"learning";return"review"};
const SN={new:"Yangi",learning:"O‘rganilmoqda",difficult:"Qiyin",review:"Takror",mastered:"O‘zlashtirilgan"};
function grade(w,ok){const p=S.p[w.id]||(S.p[w.id]={b:0,c:0,w:0,d:0});if(ok){p.c++;p.b=Math.min(5,p.b+1)}else{p.w++;p.b=Math.max(0,p.b-2)}
p.d=Date.now()+IV[p.b]*DAY;S.h[today()]=(S.h[today()]||0)+1;sv()}
const due=()=>V.filter(w=>S.p[w.id]&&S.p[w.id].d<=Date.now());
const known=()=>V.filter(w=>S.p[w.id]&&S.p[w.id].b>=3).length;
function streak(){let n=0,d=new Date();if(!S.h[today()])d=new Date(Date.now()-DAY);while(S.h[d.toISOString().slice(0,10)]){n++;d=new Date(+d-DAY)}return n}
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const pool=()=>V.filter(w=>(!F.top||w.top==F.top)&&(!F.pos||w.pos==F.pos)&&(!F.st||(F.st=="bm"?S.bm[w.id]:st(w)==F.st))&&(!F.q||(w.de+w.uz).toLowerCase().includes(F.q.toLowerCase())));
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const $=id=>document.getElementById(id);
const nm=w=>(w.art?w.art+" ":"")+w.de;
// ---- Views ----
function go(t,f){tab=t;if(f!==undefined)F=f;Q=null;fl=null;render()}
function render(){$("nav").innerHTML=[["home","🏠 Bosh"],["cards","🃏 Kartalar"],["quiz","✏️ Test"],["list","📚 Lug‘at"]].map(x=>`<button class="${tab==x[0]?"on":""}" onclick="go('${x[0]}',${x[0]=="cards"||x[0]=="quiz"?"{}":"undefined"})">${x[1]}</button>`).join("");
$("app").innerHTML=({home,cards,quiz,list})[tab]()}
function bar(a,b){return`<div class="bar"><i style="width:${b?Math.round(a/b*100):0}%"></i></div>`}
function home(){const k=known(),t=V.length,d=due().length,td=S.h[today()]||0,goal=35,tops=[...new Set(V.map(w=>w.top))];
return`<h1>Deutsch A1 Master</h1><div class="grid"><div class="card"><div class="mu">Jami lug‘at</div><div class="big">${t}</div></div><div class="card"><div class="mu">O‘rganilgan</div><div class="big">${k}</div></div>
<div class="card"><div class="mu">Qolgan</div><div class="big">${t-k}</div></div><div class="card"><div class="mu">Takrorga tayyor</div><div class="big">${d}</div></div>
<div class="card"><div class="mu">Streak 🔥</div><div class="big">${streak()} kun</div></div><div class="card"><div class="mu">Bugungi maqsad</div><div class="big">${td}/${goal}</div>${bar(td,goal)}</div></div>
<div class="card">Umumiy progress: <b>${t?Math.round(k/t*100):0}%</b>${bar(k,t)}<div class="row"><button class="b" onclick="go('cards',{due:1})">Takrorni boshlash (${d})</button><button class="o" onclick="go('cards',{st:'new'})">Yangi so‘zlar</button></div></div>
<h2>Haftalik statistika</h2><div class="card">${[...Array(7)].map((_,i)=>{const dt=new Date(Date.now()-(6-i)*DAY).toISOString().slice(0,10);return`<div class="mu">${dt.slice(5)} — ${S.h[dt]||0} ta javob</div>`}).join("")}</div>
<h2>Mavzular</h2>${tops.map(x=>{const ws=V.filter(w=>w.top==x),l=ws.filter(w=>S.p[w.id]&&S.p[w.id].b>=3).length;return`<div class="card"><b>${x}</b> <span class="mu">${ws.length} so‘z · ${l} o‘rganilgan · ${ws.length-l} qoldi · ${Math.round(l/ws.length*100)}%</span>${bar(l,ws.length)}<div class="row"><button class="b" onclick="go('cards',{top:'${x}'})">Boshlash</button></div></div>`}).join("")}
<div class="card"><div class="row"><button class="o" onclick="S.th=document.documentElement.dataset.theme=(document.documentElement.dataset.theme=='dark'?'light':'dark');sv()">🌓 Mavzu</button></div><div class="mu">Eslatma: bu boshlang‘ich to‘plam (${t} ta so‘z). Lug‘at bosqichma-bosqich kengaytiriladi.</div></div>`}
function filt(){const tops=[...new Set(V.map(w=>w.top))];return`<div class="row"><select onchange="F.top=this.value;fl=null;render()"><option value="">Barcha mavzu</option>${tops.map(x=>`<option ${F.top==x?"selected":""}>${x}</option>`).join("")}</select><select onchange="F.pos=this.value;fl=null;render()"><option value="">Barcha tur</option>${Object.keys(PN).map(k=>`<option value="${k}" ${F.pos==k?"selected":""}>${PN[k]}</option>`).join("")}</select><select onchange="F.st=this.value;fl=null;render()"><option value="">Holat</option>${Object.keys(SN).map(k=>`<option value="${k}" ${F.st==k?"selected":""}>${SN[k]}</option>`).join("")}<option value="bm" ${F.st=="bm"?"selected":""}>⭐ Belgilangan</option></select></div>`}
function cards(){if(!fl){let l=F.due?due():pool();fl={l:sh(l),i:0,f:0}}
const w=fl.l[fl.i];if(!w)return`<h1>Kartalar</h1>${filt()}<div class="card">Bu filtrda so‘z yo‘q${F.due?" — takrorga so‘z hali yo‘q":""}.</div>`;
const back=`<div class="de" style="font-size:28px">${nm(w)}</div>${w.pl?`<div class="mu">Ko‘plik: die ${w.pl}</div>`:""}<div style="font-size:20px">${w.uz}</div>${w.f?`<table>${w.f.map((x,i)=>`<tr><td class="mu">${PR[i]}</td><td>${x}</td></tr>`).join("")}</table><div class="mu">Partizip II: ${w.pp}</div>`:""}<div>${w.ex}</div><div class="mu">${w.exu}</div>`;
return`<h1>Kartalar</h1>${F.due?"":filt()}<div class="mu">${fl.i+1}/${fl.l.length} · <span class="tag">${PN[w.pos]}</span><span class="tag">${SN[st(w)]}</span></div>
<div class="fc ${fl.f?"f":""}" onclick="fl.f=!fl.f;render()"><div class="fi"><div class="fs"><div class="de">${w.de}</div><button class="o" onclick="event.stopPropagation();say('${w.de}')">🔊</button><div class="mu">Aylantirish uchun bosing</div></div><div class="fs bk">${back}</div></div></div>
<div class="row"><button class="o" onclick="say('${w.ex.replace(/'/g,"’")}')">🔊 Gap</button><button class="o" onclick="S.bm[${w.id}]=!S.bm[${w.id}];sv();render()">${S.bm[w.id]?"⭐":"☆"} Belgi</button></div>
<div class="row"><button class="b" style="background:var(--r)" onclick="nx(0)">✗ Bilmayman</button><button class="b" style="background:var(--g)" onclick="nx(1)">✓ Bilaman</button></div>
<div class="row"><button class="o" onclick="fl.i=Math.max(0,fl.i-1);fl.f=0;render()">←</button><button class="o" onclick="fl.l=sh(fl.l);fl.i=0;fl.f=0;render()">🔀</button><button class="o" onclick="fl.i=Math.min(fl.l.length-1,fl.i+1);fl.f=0;render()">→</button></div>`}
function nx(ok){grade(fl.l[fl.i],ok);if(fl.i<fl.l.length-1)fl.i++;else{fl=null;F.due=0}fl&&(fl.f=0);render()}
document.addEventListener("keydown",e=>{if(tab!="cards"||!fl||/INPUT|SELECT/.test(e.target.tagName))return;if(e.key==" "){e.preventDefault();fl.f=!fl.f;render()}else if(e.key=="ArrowRight")nx(1);else if(e.key=="ArrowLeft")nx(0)});
let tx=0;document.addEventListener("touchstart",e=>tx=e.touches[0].clientX);document.addEventListener("touchend",e=>{if(tab!="cards"||!fl)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>80)nx(d>0)});
// ---- Quiz ----
const QT={d2u:"Nemis → O‘zbek",u2d:"O‘zbek → Nemis",wr:"Nemischasini yozing",art:"Artikl (der/die/das)",con:"Fe’l tuslanishi",lis:"Tinglab toping",mix:"Aralash imtihon"};
function mk(type){const ws=sh(pool().length>=4?pool():V),out=[];const opts=(w,k)=>sh([w,...sh(V.filter(x=>x.id!=w.id&&x.pos==w.pos)).slice(0,3)]).map(x=>x[k]);
for(const w of ws){if(out.length>=10)break;let t=type=="mix"?sh(Object.keys(QT).filter(x=>x!="mix"))[0]:type;
if(t=="art"){if(w.pos!="noun")continue;out.push({w,q:w.de,a:w.art,o:["der","die","das"]})}
else if(t=="con"){if(!w.f)continue;const i=Math.floor(Math.random()*6);out.push({w,q:PR[i]+" ___ ("+w.de+")",a:w.f[i],i:1})}
else if(t=="wr")out.push({w,q:w.uz,a:w.de,i:1});
else if(t=="lis")out.push({w,q:"🔊",a:w.de,o:opts(w,"de").map(x=>x),au:1});
else if(t=="u2d")out.push({w,q:w.uz,a:w.de,o:opts(w,"de")});
else out.push({w,q:w.de,a:w.uz,o:opts(w,"uz")})}
return out}
function quiz(){if(!Q)return`<h1>Testlar</h1>${filt()}${Object.keys(QT).map(k=>`<button class="o opt" onclick="Q={t:mk('${k}'),i:0,s:0,wr:[],r:null};Q.t.length?(Q.t[0].au&&say(Q.t[0].a),render()):(Q=null,alert('Bu filtr uchun savol yetarli emas'))">${QT[k]}</button>`).join("")}`;
if(Q.i>=Q.t.length)return`<h1>Natija</h1><div class="card"><div class="big">${Q.s}/${Q.t.length}</div>${bar(Q.s,Q.t.length)}</div>${Q.wr.map(x=>`<div class="card">❌ ${x.q} → <b>${x.a}</b><div class="mu">${x.w.ex} — ${x.w.exu}</div></div>`).join("")}<button class="b" onclick="go('quiz',{})">Qayta</button>`;
const q=Q.t[Q.i];return`<h1>${Q.i+1}/${Q.t.length}</h1><div class="card"><div class="de" style="font-size:28px;text-align:center">${q.q}</div>${q.au?`<div class="row"><button class="o" onclick="say('${q.a}')">🔊 Qayta</button></div>`:""}</div>`+
(q.o?q.o.map(o=>`<button class="o opt ${Q.r?(o==q.a?"ok":o==Q.r?"no":""):""}" ${Q.r?"disabled":""} onclick="ans('${o.replace(/'/g,"\\'")}')">${o}</button>`).join(""):`<input id="ai" placeholder="Javob" autocomplete="off" autocapitalize="off" onkeydown="if(event.key=='Enter')ans(this.value)"><div class="row"><button class="b" onclick="ans($('ai').value)">Tekshirish</button></div>`)+
(Q.r?`<div class="card">${Q.r==q.a?"✅ To‘g‘ri!":"❌ To‘g‘ri javob: <b>"+q.a+"</b>"}<div class="mu">${q.w.ex} — ${q.w.exu}</div></div><button class="b" onclick="Q.i++;Q.r=null;Q.t[Q.i]&&Q.t[Q.i].au&&say(Q.t[Q.i].a);render()">Keyingisi →</button>`:"")}
function ans(v){const q=Q.t[Q.i];if(Q.r)return;v=v.trim();const ok=v.toLowerCase()==q.a.toLowerCase();Q.r=ok?q.a:(v||"—");if(ok)Q.s++;else Q.wr.push(q);grade(q.w,ok);render()}
function list(){const l=pool();return`<h1>Lug‘at</h1><input placeholder="Nemis yoki o‘zbekcha qidiring…" value="${(F.q||"").replace(/"/g,"")}" oninput="F.q=this.value;const p=this.selectionStart;render();const i=document.querySelector('input');i.focus();i.setSelectionRange(p,p)">${filt()}<div class="mu">${l.length} ta so‘z</div>`+l.map(w=>`<div class="card"><b>${nm(w)}</b> <span class="mu">${w.pl?"· die "+w.pl:""}</span> — ${w.uz} <button class="o" style="padding:2px 8px" onclick="say('${w.de}')">🔊</button> <span onclick="S.bm[${w.id}]=!S.bm[${w.id}];sv();render()">${S.bm[w.id]?"⭐":"☆"}</span><div class="mu"><span class="tag">${PN[w.pos]}</span><span class="tag">${SN[st(w)]}</span>${w.ex}</div></div>`).join("")}
init();
</script></body></html>
